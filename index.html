
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#10254a" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>
<!-- Online/Offline Status -->
<div id="connectionStatus" class="connection-status" role="status">
  Checking connection...
</div>


<div class="pwa-controls">
  <button id="installBtn" hidden>
    📲 Install NASA Space Explorer
  </button>

  <button id="notificationBtn">
    🔔 Enable Notifications
  </button>
</div>

<p id="notificationStatus" role="status" aria-live="polite"></p>



    <div class="filters">
      <input type="date" id="startDate" />
      <input type="date" id="endDate" />
      <button id="getImagesBtn">Get Space Images</button>
    </div>

    <div id="gallery" class="gallery">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>
  </div>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
  <script src="js/pwa.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker
        .register("./service-worker.js")
        .then(() => {
          console.log("Service Worker registered!");
        })
        .catch((error) => {
          console.error("Service Worker failed:", error);
        });
    });
  }
</script>

</body>
</html>
